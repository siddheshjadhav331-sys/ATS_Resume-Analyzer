{% extends 'layouts/base.html' %}

{% block title %}
Upload Resume
{% endblock %}

{% block content %}

<h1>Upload Resume</h1>

<div class="card">

    <form
    method="POST"
    enctype="multipart/form-data"
    >

        {% csrf_token %}

        {{ form.as_p }}

        <button
        class="btn"
        type="submit"
        >
            Upload Resume
        </button>

    </form>

</div>

{% endblock %}
