{% extends 'layouts/base.html' %}

{% block title %}
Jobs
{% endblock %}

{% block content %}

<div class="card">

    <h2>My Jobs</h2>

    {% for job in jobs %}

        <div class="card">

            <h3>
                {{ job.title }}
            </h3>

            <p>
                {{ job.description }}
            </p>

        </div>

    {% empty %}

        <p>
            No jobs created yet.
        </p>

    {% endfor %}

</div>

{% endblock %}
