{% extends 'layouts/base.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="card auth-card">

        <h2>Login</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required
                >
            </div>

            <button
                type="submit"
                class="btn"
            >
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="{% url 'register' %}">
                Register
            </a>
        </p>

    </div>

</div>

{% endblock %}
