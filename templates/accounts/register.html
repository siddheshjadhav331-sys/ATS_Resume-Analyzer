{% extends 'layouts/base.html' %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="card auth-card">

        <h2>Create Account</h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn"
            >
                Register
            </button>

        </form>

        <p>
            Already have an account?
            <a href="{% url 'login' %}">
                Login
            </a>
        </p>

    </div>

</div>

{% endblock %}
